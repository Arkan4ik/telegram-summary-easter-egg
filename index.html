<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Шо ти тут клацаєш?</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: #111;
    font-family: system-ui, sans-serif;
  }
  img {
    max-width: 90vw;
    max-height: 60vh;
    border-radius: 12px;
  }
  button {
    font-size: 18px;
    padding: 12px 28px;
    border: none;
    border-radius: 8px;
    background: #4f8cff;
    color: white;
    cursor: pointer;
  }
  button:hover {
    background: #3a75e0;
  }
  .button-row {
    display: flex;
    gap: 12px;
    transform: translateY(-100px);
  }
</style>
</head>
<body>
  <img id="pic" src="eastern-egg1.jpeg" alt="Шо ти тут клацаєш? Сильно цікаво?">
  <div class="button-row">
    <button id="yes" type="button">да?</button>
    <button id="no" type="button">ні</button>
  </div>
  <script>
    document.getElementById('yes').addEventListener('click', function () {
      alert('хуй на');
    });
    document.getElementById('no').addEventListener('click', function () {
      alert('рука в гамні');
    });
  </script>
</body>
</html>
