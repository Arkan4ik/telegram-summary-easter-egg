<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Click me</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: #111;
    font-family: system-ui, sans-serif;
  }
  img {
    max-width: 90vw;
    max-height: 60vh;
    border-radius: 12px;
  }
  button {
    font-size: 18px;
    padding: 12px 28px;
    border: none;
    border-radius: 8px;
    background: #4f8cff;
    color: white;
    cursor: pointer;
  }
  button:hover {
    background: #3a75e0;
  }
</style>
</head>
<body>
  <img id="pic" src="image1.svg" alt="picture">
  <button id="swap">Click me</button>
  <script>
    var img = document.getElementById('pic');
    var showingFirst = true;
    document.getElementById('swap').addEventListener('click', function () {
      showingFirst = !showingFirst;
      img.src = showingFirst ? 'image1.svg' : 'image2.svg';
    });
  </script>
</body>
</html>
